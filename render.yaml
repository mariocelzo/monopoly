# Blueprint per Render. Da "New > Blueprint" puntando a questa repo.
# Deve stare nella radice della repo: Render cerca render.yaml solo qui.
# Il codice del server sta in server/, da cui rootDir.
services:
  - type: web
    name: noi-due-monopoly-api-eu
    runtime: node
    rootDir: server
    plan: free
    # La regione non è un dettaglio: senza questa riga Render mette il
    # servizio in Oregon, e da lì ogni azione di gioco attraversa l'Atlantico.
    # Misurato sul servizio vero, a caldo, sulla stessa connessione: un tiro
    # di dadi faceva 194ms andata e ritorno da Oregon contro 34-41ms da
    # Francoforte. Il servizio attuale è nato a mano dal cruscotto con questi
    # stessi valori (nessun Blueprint lo gestisce più); questo file resta
    # come documentazione per il giorno in cui andasse ricreato da zero.
    #
    # Attenzione: su Render la regione si sceglie alla CREAZIONE e non si può
    # cambiare dopo su un servizio già esistente.
    region: frankfurt
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Origini del client separate da virgola. Da compilare dopo il primo
      # deploy su Vercel, altrimenti il browser blocca le chiamate.
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "20"
      # REDIS_URL non è dichiarata qui di proposito: contiene la password
      # dell'archivio ed è il tipo di segreto che si aggiunge a mano dal
      # cruscotto (Environment > Add Environment Variable), non da un file in
      # repo. Senza di lei il server parte lo stesso e tiene le partite solo in
      # memoria; con lei le partite sopravvivono anche ai deploy, che qui sul
      # piano gratuito ricreano il filesystem da zero. Istruzioni passo passo
      # nel README, sezione "Persistenza delle partite".
