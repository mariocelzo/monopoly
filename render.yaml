# Blueprint per Render. Da "New > Blueprint" puntando a questa repo.
# Deve stare nella radice della repo: Render cerca render.yaml solo qui.
# Il codice del server sta in server/, da cui rootDir.
services:
  - type: web
    name: noi-due-monopoly-api
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Origini del client separate da virgola. Da compilare dopo il primo
      # deploy su Vercel, altrimenti il browser blocca le chiamate.
      - key: CLIENT_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: "20"
      # REDIS_URL non è dichiarata qui di proposito: contiene la password
      # dell'archivio ed è il tipo di segreto che si aggiunge a mano dal
      # cruscotto (Environment > Add Environment Variable), non da un file in
      # repo. Senza di lei il server parte lo stesso e tiene le partite solo in
      # memoria; con lei le partite sopravvivono anche ai deploy, che qui sul
      # piano gratuito ricreano il filesystem da zero. Istruzioni passo passo
      # nel README, sezione "Persistenza delle partite".
