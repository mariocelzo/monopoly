name: Keep-alive backend

# Perché questo workflow esiste: il backend su Render (piano gratuito) va in
# sospensione dopo 15 minuti senza richieste. Non è solo un fastidio di
# latenza alla prima richiesta: siccome lo stato delle partite vive solo in
# memoria del processo, quando Render riaddormenta e poi risveglia il
# servizio il processo riparte da zero e le partite in corso spariscono.
# Un ping periodico a /health, più frequente della soglia di sospensione,
# evita che il servizio si addormenti e quindi evita quel riavvio silenzioso.
#
# Questo NON è persistenza vera: se il servizio si riavvia per un motivo
# diverso dall'inattività (un nuovo deploy, un crash, un riavvio manuale da
# Render), lo stato in memoria si perde comunque. La persistenza reale
# richiederebbe un archivio esterno (es. un DB), perché su Render il disco
# è effimero e non sopravvive ai riavvii. Questo workflow toglie solo il caso
# più comune e fastidioso — l'addormentamento per inattività serale — con un
# costo minimo.

on:
  # Ogni 5 minuti, non più ogni 14.
  #
  # PERCHÉ IL MARGINE DI UN MINUTO NON BASTAVA. Il ragionamento di prima era
  # aritmeticamente giusto e praticamente sbagliato: 14 minuti stanno sotto la
  # soglia dei 15 solo se il cron è puntuale, e i cron di GitHub Actions non lo
  # sono. La documentazione di GitHub lo dice apertamente — i job schedulati
  # finiscono in una coda condivisa e possono partire in ritardo quando la
  # piattaforma è carica, con ritardi che nella pratica arrivano a diverse
  # decine di minuti nelle ore di punta. Un ritardo di appena due minuti su un
  # margine di uno basta a far scattare la sospensione, ed è esattamente quello
  # che succedeva: il ping c'era, e il servizio si addormentava lo stesso.
  # Cronometrata in produzione, la partenza a freddo che ne seguiva costava
  # 22,9 secondi alla prima azione della serata.
  #
  # PERCHÉ CINQUE. Il margine non è più un minuto ma dieci: perché il servizio
  # si addormenti servirebbe che TUTTI i ping di una finestra di un quarto d'ora
  # arrivassero in ritardo, non uno solo. Con 5 minuti ogni finestra di 15 ne
  # contiene tre, e ne basta uno puntuale. È il classico rimedio a un
  # avvenimento inaffidabile: non renderlo puntuale — non si può — ma ripeterlo
  # abbastanza da non dipendere da nessuna singola occorrenza.
  #
  # QUANTO COSTA. Una GET a un endpoint che risponde `{"ok":true}`: da 103 a 288
  # esecuzioni al giorno, ognuna di pochi secondi. I workflow schedulati sono
  # gratuiti sui repository pubblici, e anche a voler contare i minuti restano
  # nell'ordine delle decine al giorno. Il servizio, dal canto suo, non fa
  # nulla: /health non tocca né il motore né l'archivio.
  #
  # Scendere ancora (ogni minuto) non comprerebbe niente in più — tre ping per
  # finestra bastano già a rendere improbabile il caso da evitare — e
  # moltiplicherebbe per cinque le esecuzioni. Cinque minuti è il punto in cui
  # la curva si appiattisce.
  schedule:
    - cron: "*/5 * * * *"
  # Per poterlo lanciare a mano da GitHub e verificare che funzioni senza
  # aspettare il prossimo giro di cron.
  workflow_dispatch:

# Il workflow deve solo leggere (chiamare un endpoint pubblico in GET), non
# ha nessun motivo di poter scrivere sul repository.
permissions:
  contents: read

# Con un ping ogni 5 minuti e un tentativo che può durare fino a 90 secondi più
# i riavvii, due esecuzioni possono sovrapporsi — soprattutto quando i cron
# arrivano in ritardo e ne partono due ravvicinate. Non serve a niente pingare
# in parallelo: la seconda esecuzione toglie di mezzo quella vecchia e resta
# lei, così ce n'è sempre al più una in volo. `cancel-in-progress: true` e non
# false di proposito: quella nuova è comunque più fresca, e una coda di ping in
# attesa l'uno dell'altro allungherebbe proprio le finestre che si vogliono
# tenere corte.
concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Tetto di sicurezza: se qualcosa si inceppa (rete, DNS) il job non deve
    # restare appeso fino al limite di default di GitHub.
    timeout-minutes: 10
    steps:
      - name: Chiama /health e verifica che il backend sia sveglio e sano
        run: |
          set -e

          # Il risveglio "a freddo" di Render (dopo la sospensione) può
          # richiedere fino a circa 60 secondi prima che risponda qualcosa:
          # --max-time generoso e qualche tentativo servono proprio a
          # coprire quel caso, che è la norma e non l'eccezione per la prima
          # chiamata dopo un periodo di inattività.
          RESPONSE=$(curl \
            --silent --show-error \
            --max-time 90 \
            --retry 4 \
            --retry-delay 15 \
            --retry-all-errors \
            "https://noi-due-monopoly-api.onrender.com/health")

          echo "Risposta ricevuta: $RESPONSE"

          # Non basta che curl non fallisca (potrebbe arrivare una pagina di
          # errore con HTTP 200, tipico dei proxy): si controlla il
          # contenuto atteso, altrimenti un backend rotto passerebbe
          # inosservato per settimane finché qualcuno non prova a giocare.
          echo "$RESPONSE" | grep -q '"ok":true' || {
            echo "Risposta inattesa da /health: il backend potrebbe essere rotto o irraggiungibile."
            exit 1
          }
